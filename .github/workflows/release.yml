name: Build update release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build update package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content -LiteralPath "payload/VERSION" -Raw).Trim()
          $tagVersion = "${{ github.ref_name }}".TrimStart('v','V')
          if ($version -ne $tagVersion) { throw "VERSION $version does not match tag $tagVersion" }
          $files = Get-ChildItem -LiteralPath "payload" -File -Recurse | Sort-Object FullName | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath((Resolve-Path "payload"), $_.FullName).Replace('\','/')
            [ordered]@{ path = $relative; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          [ordered]@{ version = $version; files = @($files) } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "update-manifest.json" -Encoding UTF8
          Compress-Archive -Path "payload","update-manifest.json" -DestinationPath "live-highlight-update.zip" -CompressionLevel Optimal
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "live-highlight-update.zip" --title "直播录制剪辑中控台 ${{ github.ref_name }}" --generate-notes

